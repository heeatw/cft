# 由 heeatw/docs 的 kit 注入；行為在 heeatw/docs 的 .github/workflows/ebifu-check.yml 與 kit/prompts/，要改請改那邊。
# えびふ在 Actions 裡是唯讀的：PR 建立時檢查、issue 或 PR 上寫 @ebifu 才回一則討論。main 的 docs/ 變動會通知 heeatw/docs 重新鏡射。
name: heeatw
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened]
  push:
    branches: [main]
    paths: ["docs/**"]

jobs:
  ebifu:
    # PR 開了就檢查（之後 push 不自動重審，要重看就在 PR 留言 @ebifu）；issue 只有內文或留言寫 @ebifu 才叫得起來；
    # push 到 main 只是通知 hub 重新鏡射文件（ebifu-check.yml 的 notify-hub），不跑 Claude
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@ebifu')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@ebifu'))
    uses: heeatw/docs/.github/workflows/ebifu-check.yml@main
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
